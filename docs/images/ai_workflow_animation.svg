<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes glowNode {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(99,102,241,0.4)); }
        50% { filter: drop-shadow(0 0 12px rgba(99,102,241,0.9)); }
      }
      
      .flow-line {
        stroke-dasharray: 6 4;
        animation: pulseBeam 1.2s linear infinite;
      }
      .glowing-node {
        animation: glowNode 2.5s infinite ease-in-out;
      }
    </style>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="920" height="320" rx="12" fill="#0b1120" />

  <!-- Connecting Data Flow Lines -->
  <line x1="160" y1="160" x2="240" y2="160" stroke="#6366f1" stroke-width="2.5" class="flow-line" />
  <line x1="390" y1="160" x2="470" y2="160" stroke="#38bdf8" stroke-width="2.5" class="flow-line" />
  <line x1="620" y1="160" x2="700" y2="160" stroke="#10b981" stroke-width="2.5" class="flow-line" />

  <!-- Step 1: PDF Source Input -->
  <g transform="translate(30, 80)">
    <rect width="140" height="160" rx="8" fill="url(#nodeGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="45" y="24" width="50" height="40" rx="4" fill="#ef4444" opacity="0.15" />
    <text x="60" y="50" fill="#ef4444" font-size="22">📄</text>
    <text x="70" y="95" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Student PDF</text>
    <text x="70" y="115" fill="#94a3b8" font-size="10" text-anchor="middle">Harmonické oscilace</text>
    <text x="70" y="130" fill="#64748b" font-size="9" text-anchor="middle">Kalorimetrie / Pružnost</text>
    <rect x="35" y="145" width="70" height="4" rx="2" fill="#334155" />
  </g>

  <!-- Step 2: PyMuPDF Extraction & Spatial Index -->
  <g transform="translate(250, 80)">
    <rect width="150" height="160" rx="8" fill="url(#nodeGrad)" stroke="#6366f1" stroke-width="1.5" />
    <text x="75" y="48" fill="#818cf8" font-size="24" text-anchor="middle">⚡</text>
    <text x="75" y="85" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">PyMuPDF Engine</text>
    <text x="75" y="105" fill="#a5b4fc" font-size="10" text-anchor="middle">Extrakce textu a rovnic</text>
    <text x="75" y="122" fill="#94a3b8" font-size="9" text-anchor="middle">Detekce bloků a tabulek</text>
    <text x="75" y="138" fill="#64748b" font-size="8.5" text-anchor="middle">BBox souřadnice slov</text>
  </g>

  <!-- Step 3: Google Gemini 2.5 Flash Evaluation -->
  <g transform="translate(480, 60)" class="glowing-node">
    <rect width="160" height="200" rx="10" fill="url(#nodeGrad)" stroke="url(#accentGrad)" stroke-width="2" />
    <rect x="55" y="20" width="50" height="50" rx="25" fill="rgba(99,102,241,0.2)" />
    <text x="80" y="52" fill="#38bdf8" font-size="26" text-anchor="middle">✨</text>
    <text x="80" y="92" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Gemini 2.5 Flash</text>
    <text x="80" y="112" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">Akademická analýza</text>
    
    <!-- Checklist items inside AI -->
    <text x="25" y="136" fill="#cbd5e1" font-size="9">✓ Fyzikální koncepty</text>
    <text x="25" y="152" fill="#cbd5e1" font-size="9">✓ Nejistoty a chyby</text>
    <text x="25" y="168" fill="#cbd5e1" font-size="9">✓ Interpunkce rovnic</text>
    <text x="25" y="184" fill="#cbd5e1" font-size="9">✓ Diskuze výsledků</text>
  </g>

  <!-- Step 4: Approved PDF & Moodle Rubric -->
  <g transform="translate(710, 80)">
    <rect width="180" height="160" rx="8" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="1.5" />
    <text x="90" y="48" fill="#10b981" font-size="24" text-anchor="middle">🎯</text>
    <text x="90" y="85" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Export &amp; Moodle</text>
    <text x="90" y="105" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">1-Click Schválení</text>
    <text x="90" y="124" fill="#cbd5e1" font-size="9" text-anchor="middle">Vektorové PDF s hlavičkou</text>
    <text x="90" y="139" fill="#94a3b8" font-size="8.5" text-anchor="middle">Bodové srážky do schránky</text>
  </g>

  <!-- Footer Banner -->
  <text x="460" y="300" fill="#64748b" font-size="10.5" font-weight="500" text-anchor="middle">
    Plně transparentní proces: AI pouze navrhuje, konečné rozhodnutí i modifikace zůstávají 100% v rukou cvičícího.
  </text>
</svg>
