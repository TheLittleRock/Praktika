<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes pulseDot {
        0% { transform: scale(0.9); opacity: 0.7; }
        100% { transform: scale(1.3); opacity: 1; }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes drawHighlight {
        0% { width: 0; opacity: 0; }
        50%, 100% { width: 220px; opacity: 1; }
      }
      @keyframes fadeInDelay {
        0%, 20% { opacity: 0; transform: translateY(6px); }
        40%, 100% { opacity: 1; transform: translateY(0); }
      }
      
      .pulsing-dot { animation: pulseDot 1.4s infinite alternate ease-in-out; transform-origin: 32px 578px; }
      .ai-pill { animation: floatPill 3s infinite ease-in-out; }
      .anim-hl { animation: drawHighlight 4s infinite ease-in-out; }
      .anim-card { animation: fadeInDelay 4s infinite ease-in-out; }
    </style>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="600" fill="url(#studioBg)" rx="12" />

  <!-- Top Studio Header Navigation -->
  <rect x="0" y="0" width="1000" height="48" fill="#1e293b" />
  <line x1="0" y1="48" x2="1000" y2="48" stroke="#334155" stroke-width="1" />
  
  <!-- Back Button & Student Meta -->
  <rect x="14" y="10" width="100" height="28" rx="6" fill="#334155" />
  <text x="24" y="28" fill="#f8fafc" font-size="12" font-weight="600">‹ Protokoly</text>
  <text x="130" y="29" fill="#ffffff" font-size="14" font-weight="700">Štěpán Skalka</text>
  <text x="250" y="29" fill="#94a3b8" font-size="12">Úloha 3: Harmonické oscilace | Po-č9 14:00</text>
  
  <!-- Header Right Controls -->
  <rect x="760" y="10" width="110" height="28" rx="6" fill="rgba(99,102,241,0.15)" stroke="#6366f1" stroke-width="1" />
  <text x="775" y="28" fill="#a5b4fc" font-size="12" font-weight="600">✨ AI Asistent</text>
  <rect x="880" y="10" width="106" height="28" rx="6" fill="#10b981" />
  <text x="898" y="28" fill="#ffffff" font-size="12" font-weight="700">✓ Dokončit</text>

  <!-- Studio Secondary Toolbar (Tools & Zoom) -->
  <rect x="0" y="48" width="1000" height="40" fill="#0f172a" />
  <line x1="0" y1="88" x2="1000" y2="88" stroke="#334155" stroke-width="1" />
  
  <!-- Tool Buttons -->
  <g transform="translate(16, 54)">
    <rect x="0" y="0" width="30" height="28" rx="4" fill="#334155" />
    <text x="9" y="18" fill="#f8fafc" font-size="13">✋</text>
    
    <rect x="36" y="0" width="30" height="28" rx="4" fill="#4f46e5" />
    <text x="45" y="18" fill="#ffffff" font-size="13">🖊</text>
    
    <rect x="72" y="0" width="30" height="28" rx="4" fill="#334155" />
    <text x="81" y="18" fill="#f8fafc" font-size="13">💬</text>

    <rect x="108" y="0" width="30" height="28" rx="4" fill="#334155" />
    <text x="117" y="18" fill="#f8fafc" font-size="13">🔲</text>

    <rect x="144" y="0" width="30" height="28" rx="4" fill="#334155" />
    <text x="153" y="18" fill="#f8fafc" font-size="13">➔</text>
    
    <!-- Color Palette dots -->
    <circle cx="198" cy="14" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <circle cx="216" cy="14" r="6" fill="#fef08a" />
    <circle cx="234" cy="14" r="6" fill="#bbf7d0" />
    <circle cx="252" cy="14" r="6" fill="#38bdf8" />
  </g>

  <!-- Zoom Controls (Right) -->
  <g transform="translate(560, 56)">
    <rect x="0" y="0" width="120" height="24" rx="4" fill="#1e293b" />
    <text x="12" y="16" fill="#cbd5e1" font-size="12" font-weight="600">-</text>
    <text x="40" y="16" fill="#f8fafc" font-size="11" font-weight="600">125%</text>
    <text x="100" y="16" fill="#cbd5e1" font-size="12" font-weight="600">+</text>
  </g>

  <!-- MAIN WORKSPACE: PDF Sheet (Left Center) -->
  <g transform="translate(60, 108)" filter="url(#shadow)">
    <!-- White Paper Page -->
    <rect width="560" height="460" rx="4" fill="#ffffff" />
    
    <!-- PDF Evaluation Stamp Header -->
    <rect x="25" y="16" width="510" height="74" rx="4" fill="#f8fafc" stroke="#6366f1" stroke-width="1" />
    <rect x="25" y="16" width="5" height="74" fill="#4f46e5" rx="2" />
    <text x="40" y="36" fill="#059669" font-size="12" font-weight="700">Celkem: 8.5 / 10 b  |  Známka: B</text>
    <text x="40" y="52" fill="#334155" font-size="10">Výsledky: 2.5/3  •  Diskuze: 2.5/3  •  Formát: 1.75/2  •  Chyby: 1.75/2</text>
    <text x="40" y="67" fill="#64748b" font-size="9">Opravil: Ing. Jan Novák  |  Datum: 16.10.2026</text>
    <line x1="35" y1="73" x2="525" y2="73" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="40" y="84" fill="#dc2626" font-size="8.5">• [Formát] -0.25 b: Chybí čárka za rovnicí (1) • [Výsledky] -0.5 b: Chyba typu B</text>

    <!-- Simulated Document Text Lines -->
    <text x="25" y="115" fill="#0f172a" font-size="13" font-weight="700">1. Měření doby kmitu závaží na pružině</text>
    <rect x="25" y="128" width="510" height="6" rx="2" fill="#e2e8f0" />
    <rect x="25" y="140" width="480" height="6" rx="2" fill="#e2e8f0" />
    <rect x="25" y="152" width="420" height="6" rx="2" fill="#e2e8f0" />

    <!-- Animated AI Highlight with Pill -->
    <g transform="translate(25, 170)">
      <!-- Animated Highlight Rect -->
      <rect x="0" y="0" width="220" height="18" rx="2" fill="rgba(239, 68, 68, 0.25)" stroke="#ef4444" stroke-width="1.5" class="anim-hl" />
      <text x="8" y="13" fill="#1e293b" font-size="10" font-weight="500">T = 2π * sqrt(m / k) , kde m je...</text>

      <!-- AI Proposal Floating Pill -->
      <g transform="translate(0, -28)" class="ai-pill">
        <rect width="210" height="24" rx="4" fill="#991b1b" stroke="#ef4444" stroke-width="1" />
        <text x="8" y="16" fill="#ffffff" font-size="9" font-weight="600">✨ AI: Chybí čárka za vzorcem</text>
        <rect x="145" y="4" width="58" height="16" rx="3" fill="#10b981" />
        <text x="150" y="15" fill="#ffffff" font-size="8.5" font-weight="700">✓ Aplikovat</text>
      </g>
    </g>

    <!-- Interactive Drawn Shape: Blue Rectangle -->
    <rect x="25" y="215" width="450" height="90" rx="3" fill="rgba(59, 130, 246, 0.12)" stroke="#3b82f6" stroke-width="2" />
    <text x="35" y="235" fill="#1e40af" font-size="10" font-weight="600">Tabulka 1: Naměřené periody kmitů pro různé hmotnosti</text>

    <!-- Acrobat-style Speech Bubble Note -->
    <g transform="translate(485, 215)">
      <rect x="0" y="0" width="20" height="15" rx="3" fill="#ef4444" />
      <polygon points="3,15 1,19 7,15" fill="#ef4444" />
      <line x1="4" y1="5" x2="16" y2="5" stroke="#ffffff" stroke-width="1.2" />
      <line x1="4" y1="9" x2="13" y2="9" stroke="#ffffff" stroke-width="1.2" />
    </g>

    <!-- Sleek Vector Arrow -->
    <line x1="480" y1="350" x2="380" y2="308" stroke="#ef4444" stroke-width="2" />
    <polygon points="380,308 392,316 395,306" fill="#ef4444" />
    <text x="410" y="365" fill="#ef4444" font-size="9.5" font-weight="600">Odchylka měření</text>
  </g>

  <!-- RIGHT SIDE: AI Assistant Side Drawer -->
  <g transform="translate(660, 96)">
    <rect width="324" height="488" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    
    <!-- Drawer Header -->
    <rect width="324" height="42" rx="8" fill="#0f172a" />
    <text x="16" y="26" fill="#ffffff" font-size="13" font-weight="700">✨ AI Asistent hodnocení</text>
    <rect x="230" y="10" width="78" height="22" rx="4" fill="#4f46e5" />
    <text x="242" y="25" fill="#ffffff" font-size="11" font-weight="600">↻ Spustit</text>

    <!-- AI Summary Box -->
    <rect x="14" y="52" width="296" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="24" y="70" fill="#94a3b8" font-size="10" font-weight="600">SHRNUTÍ GEMINI 2.5</text>
    <text x="24" y="86" fill="#e2e8f0" font-size="9.5">Protokol je zpracován přehledně. Byly nalezeny 2 drobné</text>
    <text x="24" y="99" fill="#e2e8f0" font-size="9.5">formální nedostatky a chybějící chyba typu B.</text>

    <!-- AI Proposals Category: Srážky bodů -->
    <text x="16" y="132" fill="#f8fafc" font-size="11" font-weight="700">Doporučené srážky bodů (2)</text>
    
    <!-- Deduction Card 1 -->
    <rect x="14" y="142" width="296" height="52" rx="6" fill="#0f172a" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1" />
    <text x="24" y="160" fill="#ef4444" font-size="10.5" font-weight="700">-0.25 b</text>
    <text x="75" y="160" fill="#f8fafc" font-size="10" font-weight="600">Chybí čárka za rovnicí (1)</text>
    <text x="24" y="176" fill="#94a3b8" font-size="8.5">Kategorie: Formát • Strana 1</text>
    <rect x="238" y="152" width="62" height="20" rx="3" fill="#10b981" />
    <text x="245" y="166" fill="#ffffff" font-size="9" font-weight="700">✓ Přidat</text>

    <!-- Deduction Card 2 -->
    <rect x="14" y="202" width="296" height="52" rx="6" fill="#0f172a" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1" />
    <text x="24" y="220" fill="#ef4444" font-size="10.5" font-weight="700">-0.50 b</text>
    <text x="75" y="220" fill="#f8fafc" font-size="10" font-weight="600">Chyba typu B u stopek</text>
    <text x="24" y="236" fill="#94a3b8" font-size="8.5">Kategorie: Výsledky • Strana 1</text>
    <rect x="238" y="212" width="62" height="20" rx="3" fill="#10b981" />
    <text x="245" y="226" fill="#ffffff" font-size="9" font-weight="700">✓ Přidat</text>

    <!-- In-Canvas AI Highlights List -->
    <text x="16" y="276" fill="#f8fafc" font-size="11" font-weight="700">Návrhy v textu PDF (1)</text>
    <rect x="14" y="286" width="296" height="64" rx="6" fill="#0f172a" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
    <text x="24" y="304" fill="#a5b4fc" font-size="9.5" font-weight="700">📍 Strana 1 • Zvýraznění</text>
    <text x="24" y="320" fill="#cbd5e1" font-size="9">„T = 2π * sqrt(m / k) , kde...“</text>
    <text x="24" y="335" fill="#f43f5e" font-size="8.5">Chybí interpunkční čárka před vzorcem</text>
  </g>

  <!-- Minimal Transparent Floating Autosave Indicator (Fixed Bottom-Left) -->
  <g transform="translate(16, 568)">
    <circle cx="6" cy="6" r="3.5" fill="#22c55e" class="pulsing-dot" />
    <text x="16" y="9.5" fill="#94a3b8" font-size="9" font-weight="600">Uloženo (14:58)</text>
  </g>
</svg>
